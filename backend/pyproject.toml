[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quarkmanager-backend"
version = "1.0.0"
description = "夸克网盘 Web 管理系统 - 后端"
readme = "README.md"
license = {file = "../LICENSE"}
authors = [{ name = "QuarkManager Team", email = "tequant.ai@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "qrcode>=7.4.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.urls]
"Homepage" = "https://github.com/lich0821/QuarkManager"
"Source" = "https://github.com/lich0821/QuarkManager"
